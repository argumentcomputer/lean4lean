# Pull upstream changes from digama0/lean4lean daily at 12am UTC
name: Repo sync

on:
  schedule:
  - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  repo-sync:
    name: Sync upstream changes
    runs-on: ubuntu-latest
    # `contents` for the sync itself, `issues` for the manual-sync issue the
    # action opens when `GITHUB_TOKEN` cannot push, e.g. an upstream change
    # under `.github/workflows/`
    permissions:
      contents: write
      issues: write
    steps:
      - uses: argumentcomputer/ci-workflows/.github/actions/repo-sync@main
        with:
          repository: digama0/lean4lean
          # This fork's default branch is `dev`; `master` is kept as a plain mirror
          # of upstream, so both sides of the sync share the branch name.
          branch: master
